# 三个平台独立编译测试；仅上传未签名验证产物，不自动发布或安装。
name: desktop-check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact: src-tauri/target/release/bundle/macos/*.tar.gz
          - os: ubuntu-24.04
            artifact: src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Browser dependencies
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run tauri -- build --ci --no-sign -- --locked
      # .app 必须先归档，否则 artifact 下载后会丢失可执行权限。
      - name: Archive macOS app
        if: runner.os == 'macOS'
        working-directory: src-tauri/target/release/bundle/macos
        run: tar -czf "Pi-Desktop-macOS-${{ runner.arch }}.app.tar.gz" "Pi Desktop.app"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.os }}-unsigned
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      # 截图与安装包分开，避免截图掩盖安装包缺失，也保留失败现场。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
