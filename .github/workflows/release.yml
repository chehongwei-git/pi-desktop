# 只发布标签对应的提交；三个平台检查和打包全部成功后才获得发布权限。
name: desktop-release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # 版本校验不安装依赖，不启用新版 setup-node 的自动缓存。
          package-manager-cache: false
      - name: Validate release version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const json = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const version = json('package.json').version;
          // 首先限制为正式版本，避免预发布标签被误发布成稳定版本。
          assert.match(version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, '标签与 package.json 版本不一致');
          assert.equal(json('package-lock.json').version, version);
          assert.equal(json('package-lock.json').packages[''].version, version);
          assert.equal(json('src-tauri/tauri.conf.json').version, version);
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const packageSection = cargo.split('[package]')[1]?.split(/\n\[/)[0];
          assert.equal(packageSection?.match(/^version\s*=\s*"([^"]+)"/m)?.[1], version);
          NODE
  build:
    needs: version
    uses: ./.github/workflows/check.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: pi-desktop-*-unsigned
          path: release-assets
          merge-multiple: true
      # 先创建草稿并上传附件，再公开；失败时避免公开不完整的新版本。
      - name: Publish GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const tag = context.ref.slice('refs/tags/'.length);
            const files = await fs.readdir('release-assets');
            for (const suffix of ['.exe', '.app.tar.gz', '.deb']) {
              if (!files.some(name => name.endsWith(suffix))) throw new Error(`缺少产物：${suffix}`);
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            // 已公开的版本不可静默覆盖；失败的草稿允许重新运行补齐附件。
            if (release && !release.draft) throw new Error('该版本已发布，请使用新的版本标签');
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `Pi Desktop ${tag}`,
                draft: true, prerelease: false,
                body: `## 更新内容

            - 支持粘贴长文本，以输入框气泡和消息卡片呈现，方便查看和编辑。
            - 支持拖入文件引用，并在消息中以卡片展示文件。
            - 修复新会话模型和思考强度选择的同步；运行中的选择在下次发送时应用，失败时保留草稿。
            - 兼容旧模型配置的图片输入能力，避免无意修改原有配置；修复事件批次唤醒竞态。
            - 升级 GitHub Actions 至 Node.js 24 运行时，统一跨平台文本换行，并完善测试和文档。

            ## 安装说明

            未签名构建：Windows NSIS 安装器、macOS .app 压缩包、Linux Debian 包。macOS 使用 Actions runner 原生架构，详见附件名称。

            应用不捆绑 Pi 或 Node.js，请先安装运行环境。Windows SmartScreen / macOS Gatekeeper 可能提示或阻止运行；本版本未进行代码签名或 macOS 公证。Linux 包并非适用于所有发行版。`,
              })).data;
            }
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id,
            });
            for (const name of files) {
              const old = existing.find(asset => asset.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name,
                data: await fs.readFile(path.join('release-assets', name)),
              });
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false });
